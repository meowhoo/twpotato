<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>地瓜輸入法 設定</title></head>
<body><main>
  <header><h1>地瓜輸入法 設定</h1><p id="status" role="status">正在確認引擎狀態…</p><p id="status-note" class="muted"></p></header>
  <nav aria-label="設定分頁"><button id="tab-lex" aria-pressed="true" aria-controls="lex">詞庫</button><button id="tab-settings" aria-pressed="false" aria-controls="settings">輸入設定</button></nav>
  <p id="message" role="status" aria-live="polite"></p>
  <section id="lex" aria-labelledby="tab-lex">
    <div class="toolbar"><label>搜尋詞或讀音 <input id="search" type="search" placeholder="詞的子字串或讀音前綴"></label><button id="import">匯入…</button><button id="export">匯出…</button></div>
    <p id="lex-warning" class="warning"></p>
    <div class="table-wrap"><table><thead><tr><th scope="col">詞</th><th scope="col">讀音</th><th scope="col">權重</th><th scope="col">操作</th></tr></thead><tbody id="entries"></tbody></table></div>
    <div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div>
    <form id="add-form"><h2>新增詞彙</h2><div class="toolbar"><label>詞 <input id="word" required autocomplete="off" placeholder="1～8 個字"></label><button id="readings" type="button">查讀音</button><label>權重（選填） <input id="weight" type="number" min="0" max="30" step="any" placeholder="預設 10"></label></div><div id="reading-selects" class="toolbar"></div><p class="muted">讀音可從「查讀音」的選單挑選、直接輸入，或用注音鍵盤輸入到選取中的字（依聲母、介音、韻母、聲調的順序；按聲調後移到下一個字）。</p><div id="keyboard" class="keyboard" role="group" aria-label="注音鍵盤"></div><p id="reading-hint" class="muted" role="status"></p><button id="add" type="submit" disabled>加入</button></form>
  </section>
  <section id="settings" aria-labelledby="tab-settings" hidden>
    <p id="settings-warning" class="warning"></p>
    <form id="settings-form">
      <label>中英切換鍵 <select id="toggle-key"><option value="shift">Shift 任一側</option><option value="left_shift">左 Shift</option><option value="right_shift">右 Shift</option><option value="none">不使用</option></select></label>
      <label>預設模式 <select id="default-mode"><option value="chinese">中文</option><option value="english">英文</option></select></label>
      <label>中文標點 <select id="punctuation"><option value="full">全形</option><option value="half">半形</option></select></label>
      <label>小符號表 <select id="symbol-table"><option value="on">開</option><option value="off">關</option></select></label>
      <label class="check"><input id="cache" type="checkbox" disabled> 快取 <span class="muted">暫停開發，目前不生效</span></label>
      <button type="submit" id="save" disabled>儲存</button>
    </form>
    <form id="autocomp-form">
      <h2>自動完成</h2>
      <p id="autocomp-warning" class="warning"></p>
      <label class="check"><input id="autocomp-list" type="checkbox"> 候選清單加入補完詞</label>
      <label class="check"><input id="autocomp-pop" type="checkbox"> 打字停頓後自動顯示補完視窗 <span class="muted">（需先勾選上一項）</span></label>
      <p class="muted">預設關閉。儲存後需重新啟動輸入法引擎才會生效；重新啟動時正在輸入的組字會中斷。</p>
      <div class="toolbar"><button type="submit" id="autocomp-apply" disabled>儲存並套用（重新啟動引擎）</button><button type="button" id="autocomp-save" disabled>只儲存（下次登入生效）</button></div>
    </form>
  </section>
</main><script type="module" src="/src/main.ts"></script></body></html>
