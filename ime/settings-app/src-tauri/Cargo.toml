[package]
name = "twime-settings"
version = "0.1.9"
edition = "2024"
license = "MIT"
publish = false

# Standalone workspace: Tauri is not built by `cargo test --workspace` in ime/.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
twime-proto = { path = "../../crates/twime-proto" }
twime-model = { path = "../../crates/twime-model" }
twime-userdata = { path = "../../crates/twime-userdata" }

[target.'cfg(windows)'.dependencies]
twime-winpipe = { path = "../../crates/twime-winpipe" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
