# License policy of the TwIme settings app (user decision 2026-10-25, option (a)).
[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause"]
confidence-threshold = 0.8
# Exceptions accepted by the user on 2026-10-25 (see ../THIRD-PARTY-NOTICES.md). Nothing else is allowed.
exceptions = [
    # Unicode-3.0: ICU4X family (runtime, via url -> idna) and unicode-ident (build time).
    { allow = ["Unicode-3.0"], crate = "icu_collections" },
    { allow = ["Unicode-3.0"], crate = "icu_locale_core" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer_data" },
    { allow = ["Unicode-3.0"], crate = "icu_properties" },
    { allow = ["Unicode-3.0"], crate = "icu_properties_data" },
    { allow = ["Unicode-3.0"], crate = "icu_provider" },
    { allow = ["Unicode-3.0"], crate = "litemap" },
    { allow = ["Unicode-3.0"], crate = "potential_utf" },
    { allow = ["Unicode-3.0"], crate = "tinystr" },
    { allow = ["Unicode-3.0"], crate = "writeable" },
    { allow = ["Unicode-3.0"], crate = "yoke" },
    { allow = ["Unicode-3.0"], crate = "yoke-derive" },
    { allow = ["Unicode-3.0"], crate = "zerofrom" },
    { allow = ["Unicode-3.0"], crate = "zerofrom-derive" },
    { allow = ["Unicode-3.0"], crate = "zerotrie" },
    { allow = ["Unicode-3.0"], crate = "zerovec" },
    { allow = ["Unicode-3.0"], crate = "zerovec-derive" },
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
    # MPL-2.0, unmodified: option-ext (runtime, via dirs); cssparser, cssparser-macros, selectors, dtoa-short (build time).
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    # Zlib, build time.
    { allow = ["Zlib"], crate = "foldhash" },
    { allow = ["Zlib"], crate = "zlib-rs" },
]

[licenses.private]
ignore = true
