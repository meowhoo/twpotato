[package]
name = "twime-tsf"
version = "0.1.9"
edition = "2024"
license = "MIT"
publish = false

# VERSIONINFO resource (build.rs, ../../build/versioninfo.rs)
[build-dependencies]
embed-resource = "=3.0.12"

[lib]
crate-type = ["cdylib"]

[dependencies]
twime-proto = { path = "../twime-proto" }
twime-winpipe = { path = "../twime-winpipe" }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]
