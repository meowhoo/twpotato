[package]
name = "twime-tools"
version = "0.1.9"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
twime-model = { path = "../twime-model" }
twime-core = { path = "../twime-core" }
twime-proto = { path = "../twime-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.62"

[target.'cfg(windows)'.dependencies]
twime-winpipe = { path = "../twime-winpipe" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]
